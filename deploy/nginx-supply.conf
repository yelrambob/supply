# Nginx site config for hosting the supply webpage + images on the AWS Ubuntu box.
#
# Install:
#   sudo cp deploy/nginx-supply.conf /etc/nginx/sites-available/supply
#   sudo ln -s /etc/nginx/sites-available/supply /etc/nginx/sites-enabled/supply
#   sudo rm -f /etc/nginx/sites-enabled/default   # avoid the stock page colliding
#   sudo nginx -t && sudo systemctl reload nginx
#
# Once you have a domain, run `sudo certbot --nginx -d your.domain` (certbot
# rewrites this file to add the TLS server block) instead of editing by hand.

server {
    listen 80;
    listen [::]:80;

    # server_name your.domain.com;   # add once you have a domain; leave default (IP) for now
    server_name _;

    root /var/www/supply/html;
    index index.html;

    # Static webpage
    location / {
        try_files $uri $uri/ =404;
    }

    # Images referenced by the page, e.g. <img src="/images/widget.jpg">
    location /images/ {
        alias /var/www/supply/images/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    client_max_body_size 20m;
}
